name: Release

on:
  push:
    tags:
      - "v*"

env:
  APP_TAG: ""
  APP_VERSION: ""

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $version = $tag.TrimStart("v")

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag. Expected vX.Y.Z"
          }

          echo "APP_TAG=$tag" >> $env:GITHUB_ENV
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Inno Setup and 7-Zip
        shell: pwsh
        run: |
          choco install innosetup 7zip -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Patch version files
        shell: pwsh
        run: |
          $version = "${env:APP_VERSION}"
          ./scripts/set_version.ps1 -Version $version

      - name: Fetch runtime assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\fetch_runtime_assets.ps1

      - name: Build Wails app
        shell: pwsh
        run: |
          wails build -clean -platform windows/amd64

      - name: Build Helper service
        shell: pwsh
        run: |
          go build -ldflags "-s -w" -o build/bin/MisetaniboxHelper.exe ./cmd/goclashz-helper/

      - name: Validate core files
        shell: pwsh
        run: |
          .\scripts\validate_assets.ps1 -AssetRoot .\build\runtime-assets\core\bin

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe package.iss

      - name: Prepare portable directory
        shell: pwsh
        run: |
          $root = "build/portable/Misetanibox"
          New-Item -ItemType Directory -Force "$root/seed/core/bin" | Out-Null
          New-Item -ItemType File -Force "$root/.portable" | Out-Null

          Copy-Item "build/bin/Misetanibox.exe" "$root/Misetanibox.exe" -Force
          Copy-Item "build/bin/MisetaniboxHelper.exe" "$root/MisetaniboxHelper.exe" -Force
          Copy-Item "build/runtime-assets/core/bin/*" "$root/seed/core/bin" -Recurse -Force
          if (Test-Path "build/runtime-assets/core/asset-manifest.json") {
            Copy-Item "build/runtime-assets/core/asset-manifest.json" "$root/seed/core/asset-manifest.json" -Force
          }

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/portable/Misetanibox/*" -DestinationPath "build/Misetanibox_Portable.zip" -Force

      - name: Pack portable 7z
        shell: pwsh
        run: |
          7z a -t7z "build/Misetanibox_Portable.7z" "build/portable/Misetanibox\*" -mx=9

      - name: Move installer
        shell: pwsh
        run: |
          $src = "build/installer/Misetanibox_win_amd64_Setup.exe"
          $dst = "build/Misetanibox_win_amd64_Setup.exe"

          if (!(Test-Path $src)) {
            throw "Installer not found: $src"
          }

          Copy-Item $src $dst -Force

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${env:APP_TAG}"

          if (!(Test-Path "CHANGELOG.md")) {
            throw "CHANGELOG.md not found"
          }

          $content = Get-Content "CHANGELOG.md" -Raw
          $pattern = "(?ms)^##\s+$tag\s*(.*?)(?=^##\s+v|\z)"
          $match = [regex]::Match($content, $pattern)

          if (!$match.Success) {
            throw "No changelog section found for $tag"
          }

          $changes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($changes)) {
            $changes = "1. "
          }

          $notes = @"
          $changes
          "@

          $notes = $notes -replace "(?m)^[ \t]+", ""
          Set-Content "build/release_notes.md" $notes -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Misetanibox ${{ env.APP_TAG }}
          tag_name: ${{ env.APP_TAG }}
          body_path: build/release_notes.md
          files: |
            build/Misetanibox_win_amd64_Setup.exe
            build/Misetanibox_Portable.zip
            build/Misetanibox_Portable.7z
