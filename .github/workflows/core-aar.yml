name: Core AAR (gomobile feasibility)

on:
  workflow_dispatch:
  push:
    tags:
      - "aar-v*"

permissions:
  contents: write

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Build mihomo .aar
        working-directory: mobile/core
        run: |
          go mod download
          gomobile bind -v -target=android/arm64,android/arm64 -androidapi 21 -o mihomo.aar . 2>&1 | tail -60

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-aar
          path: mobile/core/mihomo.aar
          retention-days: 14
