name: Linux Build

on:
  push:
    tags:
      - "linux-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (GTK3 + WebKit2GTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Fetch mihomo Linux core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # стабильное ядро MetaCubeX под linux amd64 (compatible)
          rel=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          url=$(echo "$rel" | grep -oE '"browser_download_url": *"[^"]*mihomo-linux-amd64-compatible-v[0-9.]+\.gz"' | head -1 | sed 's/.*"browser_download_url": *"//; s/"$//')
          echo "core url: $url"
          mkdir -p build/linux/core
          curl -sL "$url" -o /tmp/core.gz
          gunzip -c /tmp/core.gz > build/linux/core/clash
          chmod +x build/linux/core/clash

      - name: Build (wails, webkit2gtk 4.1)
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -o Misetanibox

      - name: Package tarball
        run: |
          set -e
          mkdir -p dist/Misetanibox
          cp build/bin/Misetanibox dist/Misetanibox/Misetanibox
          cp -r build/linux/core dist/Misetanibox/core || true
          cp CHANGELOG.md dist/Misetanibox/ || true
          cd dist
          tar -czf Misetanibox_linux_amd64.tar.gz Misetanibox
          ls -la

      - name: Build .deb and Arch package (nfpm)
        run: |
          set -e
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="${GITHUB_REF_NAME#linux-v}"
          case "$VERSION" in ''|linux-*|*[!0-9.]*) VERSION="0.0.0" ;; esac
          echo "package version: $VERSION"
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/Misetanibox_${VERSION}_amd64.deb"
          nfpm package -f packaging/nfpm.yaml -p archlinux -t "dist/Misetanibox_${VERSION}_x86_64.pkg.tar.zst"
          ls -la dist/

      - name: Build AppImage (single self-contained file)
        run: |
          set -e
          export VERSION="${GITHUB_REF_NAME#linux-v}"
          case "$VERSION" in ''|linux-*|*[!0-9.]*) VERSION="0.0.0" ;; esac
          WS="$GITHUB_WORKSPACE"

          # инструменты (извлекаем, т.к. в CI нет FUSE)
          cd /tmp
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null && mv squashfs-root ld
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null && mv squashfs-root ait
          cp linuxdeploy-plugin-gtk.sh ld/usr/bin/ 2>/dev/null || cp linuxdeploy-plugin-gtk.sh ld/

          # AppDir
          cd "$WS"
          rm -rf AppDir
          mkdir -p AppDir/usr/bin/seed/core/bin AppDir/apprun-hooks AppDir/usr/lib/webkit2gtk-4.1
          cp build/bin/Misetanibox AppDir/usr/bin/misetanibox
          cp build/linux/core/clash AppDir/usr/bin/seed/core/bin/clash
          chmod +x AppDir/usr/bin/misetanibox AppDir/usr/bin/seed/core/bin/clash

          # вспомогательные процессы WebKit (иначе окно белое) + хук с путём
          WKDIR="/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          [ -d "$WKDIR" ] && cp -r "$WKDIR"/* AppDir/usr/lib/webkit2gtk-4.1/ || echo "no webkit libexec at $WKDIR"
          cat > AppDir/apprun-hooks/webkit.sh <<'HOOK'
          export WEBKIT_EXEC_PATH="${APPDIR}/usr/lib/webkit2gtk-4.1"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          HOOK

          export DEPLOY_GTK_VERSION=3
          export PATH="/tmp/ld/usr/bin:$PATH"
          /tmp/ld/AppRun --appdir AppDir \
            -e AppDir/usr/bin/misetanibox \
            -d packaging/misetanibox.desktop \
            -i build/appicon.png --icon-filename misetanibox \
            --plugin gtk

          ARCH=x86_64 /tmp/ait/AppRun --no-appstream AppDir "dist/Misetanibox-${VERSION}-x86_64.AppImage"
          chmod +x "dist/Misetanibox-${VERSION}-x86_64.AppImage"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Misetanibox_linux_amd64
          path: |
            dist/Misetanibox_linux_amd64.tar.gz
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.AppImage
          retention-days: 14
