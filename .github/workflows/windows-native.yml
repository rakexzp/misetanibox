name: Windows Native Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Safe isolated Go tests
        shell: pwsh
        run: |
          $env:GOCLASHZ_DATA_DIR = Join-Path $env:RUNNER_TEMP 'native-prototype-tests'
          go test -count=1 ./core/appcore ./core/clash ./core/instance ./core/utils ./windows-native/ipc
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
      - name: Build backend, helper and self-contained WinUI archive
        shell: pwsh
        run: ./windows-native/build-windows.ps1
      - name: Source startup and UI guards
        shell: pwsh
        run: python -X utf8 -m unittest discover -s windows-native/tests -v
      - name: Smoke extracted published ZIP (no VPN or helper)
        shell: pwsh
        run: ./windows-native/smoke-windows.ps1
      - name: Upload safe startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-smoke
          path: windows-native/artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload prototype (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Misetanibox-Lite-Windows-x64-prototype
          path: windows-native/artifacts/Misetanibox-Lite-Windows-x64-prototype.zip
          if-no-files-found: error
          retention-days: 14
